[project]
name = "grow2"
version = "0.0.1"
description = "A local musical terrarium that grows by listening."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# the embedding ear: CLAP audio embeddings for novelty and taste
clap = ["torch>=2.2", "transformers>=4.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["grow"]

[tool.setuptools.package-data]
grow = ["static/*"]
